<!DOCTYPE html>
<!-- Social sharing card template (1200x630). scripts/build-og-cards.sh screenshots it once per material page:
     og-card.html?photo=<file in assets/img>&title=<headline> -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0C1C33; }
  .card { position: relative; width: 1200px; height: 630px; color: #fff; font-family: "Geist", sans-serif; }
  .card img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card::before { content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(90deg, rgba(12,28,51,.97) 0%, rgba(12,28,51,.9) 42%, rgba(12,28,51,.35) 100%), linear-gradient(0deg, rgba(25,91,166,.35), rgba(25,91,166,0) 60%); }
  .in { position: absolute; inset: 0; z-index: 2; padding: 64px 72px; display: flex; flex-direction: column; }
  .logo { height: 66px; width: auto; align-self: flex-start; }
  .tag { margin: auto 0 18px; font: 500 22px/1 "Geist Mono", monospace; letter-spacing: .18em; text-transform: uppercase; color: #4E83C2; }
  h1 { margin: 0; max-width: 820px; font-weight: 400; font-size: 84px; line-height: 1; letter-spacing: -.045em; }
  .foot { margin-top: 34px; display: flex; gap: 28px; font: 400 22px/1 "Geist Mono", monospace; color: rgba(255,255,255,.75); }
  .foot b { font-weight: 400; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <img class="bg" id="photo" alt="">
  <div class="in">
    <img class="logo" src="../assets/img/logo-on-dark.svg" alt="">
    <p class="tag">We buy surplus</p>
    <h1 id="title"></h1>
    <p class="foot"><span>Pick-up across North America</span><b>+1 203-516-5235</b></p>
  </div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('photo').src = '../assets/img/' + q.get('photo');
  document.getElementById('title').textContent = q.get('title');
</script>
</body>
</html>
